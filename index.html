<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zilber</title>
<meta name="description" content="Find me on Instagram, LinkedIn and TikTok.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --fog: #E4E7EA;
    --paper: #F1F3F4;
    --ink: #16191D;
    --muted: #6B727A;
    --line: #CDD2D7;
    --ease: cubic-bezier(.2, .7, .1, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fog: #121417;
      --paper: #1A1D21;
      --ink: #E9ECEF;
      --muted: #8A929B;
      --line: #2A2E34;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--fog);
    color: var(--ink);
    font-family: "Familjen Grotesk", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: clamp(16px, 5vh, 56px) 16px 40px;
    -webkit-font-smoothing: antialiased;
  }

  main { width: 100%; max-width: 560px; display: flex; flex-direction: column; }

  /* ---------- Header ---------- */
  .me { margin-bottom: 20px; }

  .banner {
    position: relative;
    aspect-ratio: 2 / 1;
    border-radius: 14px;
    overflow: hidden;
    background: var(--line);
  }
  .banner video { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* soft shade at the bottom so the name stays readable over the video */
  .banner::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(10, 12, 15, .55), rgba(10, 12, 15, 0) 55%);
    pointer-events: none;
  }

  h1 {
    position: absolute;
    left: 20px; bottom: 18px;
    z-index: 1;
    color: #fff;
    font-size: clamp(26px, 7vw, 38px);
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.01em;
    text-shadow: 0 1px 12px rgba(0, 0, 0, .25);
  }
  h1::after {
    content: "";
    display: block;
    height: 3px;
    margin-top: 8px;
    background: #fff;
    border-radius: 2px;
  }

  .avatar {
    position: relative;
    width: 88px; height: 88px;
    border-radius: 50%;
    overflow: hidden;
    margin: -44px 20px 0 auto;
    border: 4px solid var(--fog);
    background: var(--line);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .bio {
    margin-top: 18px;
    font-size: 17px;
    line-height: 1.5;
    color: var(--muted);
    max-width: 36ch;
  }

  /* ---------- Links ---------- */
  .links { list-style: none; border-top: 1px solid var(--line); }
  .links li { border-bottom: 1px solid var(--line); }

  .link {
    position: relative;
    display: grid;
    grid-template-columns: 28px 1fr auto;
    align-items: center;
    gap: 18px;
    padding: 26px 14px;
    color: inherit;
    text-decoration: none;
    overflow: hidden;
    isolation: isolate;
    border-radius: 2px;
    transition: color .45s var(--ease);
  }

  /* the platform colour wipes up from the bottom */
  .link::before {
    content: "";
    position: absolute; inset: 0;
    z-index: -1;
    background: var(--brand);
    transform: scaleY(0);
    transform-origin: bottom;
    transition: transform .5s var(--ease);
  }

  .link svg { width: 24px; height: 24px; display: block; }

  .name {
    font-size: clamp(24px, 6vw, 32px);
    font-weight: 500;
    letter-spacing: -0.03em;
    transition: transform .5s var(--ease);
  }

  .handle {
    font-family: "DM Mono", ui-monospace, monospace;
    font-size: 13px;
    color: var(--muted);
    display: flex; align-items: center; gap: 10px;
    transition: color .45s var(--ease);
  }

  .arrow {
    display: inline-block;
    transition: transform .5s var(--ease);
  }

  .link:hover, .link:focus-visible { color: #fff; }
  .link:hover::before, .link:focus-visible::before { transform: scaleY(1); }
  .link:hover .name, .link:focus-visible .name { transform: translateX(6px); }
  .link:hover .handle, .link:focus-visible .handle { color: rgba(255,255,255,.85); }
  .link:hover .arrow, .link:focus-visible .arrow { transform: translate(3px, -3px); }

  .link:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  /* second accounts: quieter rows that sit under the main one */
  .link.alt { padding-top: 16px; padding-bottom: 16px; }
  .link.alt .name { font-size: clamp(18px, 4.6vw, 21px); color: var(--muted); transition: transform .5s var(--ease), color .45s var(--ease); }
  .link.alt svg { width: 18px; height: 18px; margin-left: 3px; opacity: .85; }
  .link.alt:hover .name, .link.alt:focus-visible .name { color: #fff; }
  .link.alt:hover svg, .link.alt:focus-visible svg { opacity: 1; }
  .tag {
    font-family: "DM Mono", ui-monospace, monospace;
    font-size: 11px; letter-spacing: .02em;
    margin-left: 10px; vertical-align: middle;
    opacity: .75;
  }
  /* main + second account of the same platform read as one group */
  .links li:has(+ li .alt) { border-bottom-style: dashed; }

  .instagram {
    --brand: linear-gradient(105deg, #FEDA75 0%, #FA7E1E 22%, #D62976 52%, #962FBF 78%, #4F5BD5 100%);
  }
  .linkedin { --brand: #0A66C2; }
  .tiktok   { --brand: #010101; }

  /* TikTok's signature cyan/red offset on the icon */
  .tiktok svg { overflow: visible; }
  .tiktok .tt-c, .tiktok .tt-r { transition: transform .4s var(--ease); }
  .tiktok .tt-c { transform: translate(-1.2px, -0.8px); }
  .tiktok .tt-r { transform: translate(1.2px, 0.8px); }
  .tiktok:hover .tt-c, .tiktok:focus-visible .tt-c { transform: translate(-1.8px, -1.2px); }
  .tiktok:hover .tt-r, .tiktok:focus-visible .tt-r { transform: translate(1.8px, 1.2px); }

  /* icons keep their app colours; they turn white once the row fills */
  .linkedin svg { color: #0A66C2; transition: color .45s var(--ease); }
  .ig-icon * { transition: stroke .45s var(--ease), fill .45s var(--ease); }
  .link:hover svg, .link:focus-visible svg { color: #fff; }
  .instagram:hover .ig-icon rect, .instagram:hover .ig-icon circle,
  .instagram:focus-visible .ig-icon rect, .instagram:focus-visible .ig-icon circle { stroke: #fff; }
  .instagram:hover .ig-icon circle[stroke="none"],
  .instagram:focus-visible .ig-icon circle[stroke="none"] { fill: #fff; }

  /* ---------- Footer ---------- */
  footer {
    margin-top: auto;
    padding-top: 64px;
    font-family: "DM Mono", ui-monospace, monospace;
    font-size: 12px;
    color: var(--muted);
    display: flex; justify-content: space-between;
  }

  /* ---------- Load-in ---------- */
  .rise { opacity: 0; transform: translateY(14px); animation: rise .8s var(--ease) forwards; }
  .d1 { animation-delay: .05s; } .d2 { animation-delay: .15s; }
  .d3 { animation-delay: .3s; }  .d4 { animation-delay: .38s; }
  .d5 { animation-delay: .46s; } .d6 { animation-delay: .54s; }
  .d7 { animation-delay: .62s; } .d8 { animation-delay: .75s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (max-width: 420px) {
    .link { grid-template-columns: 24px 1fr; padding: 22px 10px; }
    .handle { grid-column: 2; margin-top: -10px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
    .rise { opacity: 1; transform: none; }
  }
</style>
</head>
